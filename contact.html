    <header class="site-header impact-header solid" data-header>
      <a class="brand" href="index.html" aria-label="MKL-Tech home"><img src="assets/mkl-logo-round.png" alt="MKL-Tech logo"><span><strong>MKL-Tech</strong></span></a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" data-nav-toggle><span></span><span></span></button>
      <nav class="site-nav impact-nav" data-nav>
        <a href="index.html">Home</a><a href="sell-trade.html">Sell or Trade In</a><a href="https://www.facebook.com/marketplace/profile/100022812621790/" target="_blank" rel="noopener">Shop Tech</a><a href="portfolio.html">PC Builds</a><a href="impact.html">Our Impact</a><a href="reviews.html">Reviews</a><a href="about.html">About</a>
      </nav>
    </header>
    <main class="page-main">
      <section class="page-hero">
        <p class="section-kicker">Contact</p>
        <h1>Start a build request.</h1>
      </section>
      <section class="section-wrap request compact-page">
        <div class="request-copy">
          <div class="contact-panel">
            <h3>Direct contact</h3>
            <p><strong>Email:</strong> <a href="mailto:mkl.tech.pc@gmail.com">mkl.tech.pc@gmail.com</a></p>
          </div>
        </div>
        <form class="request-form" action="https://formspree.io/f/mjkdzejd" method="POST" data-request-form>
          <div class="form-row"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
          <div class="form-row"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="form-row two">
            <div><label for="budget">Budget range</label><select id="budget" name="budget" required><option value="">Choose one</option><option>$400-$700</option><option>$700-$1,000</option><option>$1,000-$1,500</option><option>$1,500+</option><option>Not sure yet</option></select></div>
            <div><label for="timeline">Ideal timing</label><select id="timeline" name="timeline"><option>Flexible</option><option>Within 1 week</option><option>Within 2-3 weeks</option><option>This month</option></select></div>
          </div>
          <div class="form-row"><label for="use-case">Main use</label><input id="use-case" name="main_use" type="text" placeholder="Gaming, school, streaming, editing, work, etc."></div>
          <div class="form-row"><label for="preferences">Preferences</label><textarea id="preferences" name="preferences" rows="5" placeholder="Games, monitor resolution, color/RGB style, quiet operation, storage needs, existing parts, or anything else you care about." required></textarea></div>
          <input type="hidden" name="source" value="MKL-Tech 2026 professional site">
          <button class="button primary full" type="submit">Send build request</button>
        </form>
      </section>
    </main>
    <footer class="site-footer"><div><img src="assets/mkl-logo.png" alt=""><span>MKL-Tech</span></div><p>Built, tested, and prepared by MKL-Tech.</p><small>&copy; <span data-year></span> MKL-Tech. All rights reserved.</small></footer>
