name: OSG HCP Artifact Transfer
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed country CSVs
        run: |
          python - <<'PY'
          import csv,collections,json,pathlib
          base=pathlib.Path('osg_hcp_recovered')
          specs={
          'osg_us_4400.csv':(4400,{'Anesthesiologist':400,'Emergency General/Trauma/Acute Care Surgeon':500,'Neurosurgeon':500,'Cardiothoracic Surgeon':500,'General/GI Surgeon':500,'Ortho Surgeon':500,'ER Physician':500,'Critical Care Physician/Intensivist':500,'Clinical/Bedside Pharmacists':500}),
          'osg_germany_3000.csv':(3000,{'Anesthesiologist':400,'Emergency General/Trauma/Acute Care Surgeon':300,'Neurosurgeon':300,'Cardiothoracic Surgeon':300,'General/GI Surgeon':300,'Ortho Surgeon':300,'ER Physician':400,'Critical Care Physician/Intensivist':400,'Clinical/Bedside Pharmacists':300})}
          aliases={'Clinical/Bedside Pharmacist':'Clinical/Bedside Pharmacists'}
          for fn,(n,quota) in specs.items():
            with open(base/fn,encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
            assert len(rows)==n,(fn,len(rows))
            cat=next(h for h in rows[0] if h.strip().lower() in ('osg target category','category','osg_category'))
            name=next(h for h in rows[0] if h.strip().lower() in ('clinician','name','hcp name','provider name'))
            counts=collections.Counter(aliases.get((r.get(cat) or '').strip(),(r.get(cat) or '').strip()) for r in rows)
            assert counts==collections.Counter(quota),(fn,counts)
            assert all((r.get(name) or '').strip() for r in rows),fn
          print('Validated US 4400 and Germany 3000 exact quotas')
          PY
      - name: Upload validated HCP country files
        uses: actions/upload-artifact@v4
        with:
          name: osg-hcp-country-csvs
          path: osg_hcp_recovered/
          retention-days: 7
