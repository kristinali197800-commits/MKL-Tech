name: OSG HCP Public Data Build
on:
  push:
    branches: [osg-hcp-build-20260820]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pypdf
      - name: Build public HCP datasets
        run: python tools/osg_hcp_build.py all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osg-hcp-public-data
          path: |
            us_4400.csv
            de_3000.csv
            jp_gap_categories.csv
          if-no-files-found: warn
